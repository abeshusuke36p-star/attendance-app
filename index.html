<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大学出席管理 - タイムテーブル</title>
  <!-- ファビコン（タブ・ブックマーク用アイコン） -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%234f46e5'/><path fill='none' stroke='%23ffffff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round' d='M50 22 L85 38 L50 54 L15 38 Z M28 48.5 V66 C28 73 72 73 72 66 V48.5 M80 41 V66'/></svg>">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* iPhoneでの入力時フォーカスズーム防止（16px固定） */
    input, select, textarea {
      font-size: 16px !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24 min-h-screen">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-bold flex items-center gap-2">
        <i class="fa-solid fa-graduation-cap"></i> 大学出席ノート
      </h1>
      <button id="btn-open-settings" class="p-2 rounded-full hover:bg-indigo-700 transition">
        <i class="fa-solid fa-gear text-lg"></i>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <main class="max-w-3xl mx-auto px-3 py-4">

    <!-- 1. 出欠記録タブ -->
    <section id="view-records" class="tab-content">
      <!-- 週ナビゲーション -->
      <div class="bg-white rounded-xl shadow-sm p-3 mb-3 flex items-center justify-between">
        <button id="btn-prev-week" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition">
          <i class="fa-solid fa-chevron-left mr-1"></i> 前週
        </button>
        <div class="text-center">
          <div id="week-display-label" class="font-bold text-slate-800 text-sm">2026年 10月 第1週</div>
          <div id="week-date-range" class="text-[11px] text-slate-500">10/05 (月) 〜 10/09 (金)</div>
        </div>
        <div class="flex gap-1">
          <button id="btn-this-week" class="px-2 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg text-xs font-semibold transition">
            今週
          </button>
          <button id="btn-next-week" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition">
            次週 <i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>

      <!-- 出欠入力用 時間割グリッド -->
      <div class="bg-white rounded-2xl shadow-sm p-3 overflow-x-auto hide-scrollbar">
        <div id="attendance-grid-container">
          <!-- JSで動的に表示 -->
        </div>
      </div>
    </section>

    <!-- 2. 時間割一括編集タブ -->
    <section id="view-timetable-edit" class="tab-content hidden">
      <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 mb-3 flex justify-between items-center">
        <div>
          <h2 class="text-xs font-bold text-indigo-900"><i class="fa-solid fa-pen-to-square mr-1"></i> 時間割の一括設定</h2>
          <p class="text-[11px] text-indigo-700 mt-0.5">空きコマをタップで新規追加、科目タップで編集できます。</p>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm p-3 overflow-x-auto hide-scrollbar">
        <div id="edit-grid-container">
          <!-- JSで一括編集グリッドを出力 -->
        </div>
      </div>
    </section>

    <!-- 3. 出席状況集計タブ（時間割形式） -->
    <section id="view-summary" class="tab-content hidden">
      <div class="bg-white rounded-xl p-3 mb-3 shadow-sm border border-slate-100 flex justify-between items-center">
        <div>
          <h2 class="text-xs font-bold text-slate-800">出席状況集計（時間割マップ）</h2>
          <p class="text-[10px] text-slate-500">コマをタップすると詳しい出欠履歴を確認できます。</p>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm p-3 overflow-x-auto hide-scrollbar">
        <div id="summary-grid-container">
          <!-- JSで集計用の時間割グリッドを出力 -->
        </div>
      </div>
    </section>

  </main>

  <!-- ボトムナビゲーションバー -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30">
    <div class="max-w-3xl mx-auto flex justify-around">
      <button class="nav-btn active flex-1 py-2 flex flex-col items-center text-indigo-600 font-bold transition" data-tab="records">
        <i class="fa-solid fa-calendar-check text-lg mb-0.5"></i>
        <span class="text-[10px]">出欠記録</span>
      </button>
      <button class="nav-btn flex-1 py-2 flex flex-col items-center text-slate-400 font-medium transition" data-tab="timetable-edit">
        <i class="fa-solid fa-table-cells text-lg mb-0.5"></i>
        <span class="text-[10px]">時間割編集</span>
      </button>
      <button class="nav-btn flex-1 py-2 flex flex-col items-center text-slate-400 font-medium transition" data-tab="summary">
        <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
        <span class="text-[10px]">状況集計</span>
      </button>
    </div>
  </nav>

  <!-- ----------------- モーダル群 ----------------- -->

  <!-- 1. 出欠記録モーダル -->
  <div id="modal-record" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 shadow-xl transition-all">
      <div class="flex justify-between items-start mb-3">
        <div>
          <div id="rec-modal-date" class="text-xs font-bold text-indigo-600">2026/10/05(月) 1限</div>
          <h3 id="rec-modal-title" class="text-base font-bold text-slate-800">科目名</h3>
        </div>
        <button class="btn-close-modal text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <form id="form-attendance-record" class="space-y-4">
        <!-- ステータス選択（出席・遅刻・欠席・休講/テストなし） -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2">出欠ステータス</label>
          <div class="grid grid-cols-4 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="status" value="present" class="peer sr-only" checked>
              <div class="py-2.5 text-center text-[11px] font-bold rounded-xl border border-slate-200 text-slate-600 peer-checked:bg-emerald-500 peer-checked:text-white peer-checked:border-emerald-500 transition">
                <i class="fa-solid fa-circle-check block mb-0.5 text-sm"></i> 出席
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="status" value="late" class="peer sr-only">
              <div class="py-2.5 text-center text-[11px] font-bold rounded-xl border border-slate-200 text-slate-600 peer-checked:bg-amber-500 peer-checked:text-white peer-checked:border-amber-500 transition">
                <i class="fa-solid fa-clock block mb-0.5 text-sm"></i> 遅刻
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="status" value="absent" class="peer sr-only">
              <div class="py-2.5 text-center text-[11px] font-bold rounded-xl border border-slate-200 text-slate-600 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 transition">
                <i class="fa-solid fa-circle-xmark block mb-0.5 text-sm"></i> 欠席
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="status" value="cancelled" class="peer sr-only">
              <div class="py-2.5 text-center text-[11px] font-bold rounded-xl border border-slate-200 text-slate-600 peer-checked:bg-slate-600 peer-checked:text-white peer-checked:border-slate-600 transition">
                <i class="fa-solid fa-ban block mb-0.5 text-sm"></i> 休講/無
              </div>
            </label>
          </div>
        </div>

        <!-- 遅刻時間入力 (OS風ダイヤル選択) -->
        <div id="delay-input-container" class="bg-amber-50 border border-amber-200 p-3 rounded-xl hidden">
          <label class="block text-xs font-bold text-amber-800 mb-1.5"><i class="fa-solid fa-stopwatch mr-1"></i> 遅刻時間の指定</label>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10px] text-amber-700 font-bold mb-1">分 (0〜90分)</label>
              <select id="select-delay-min" class="w-full bg-white border border-amber-300 rounded-xl px-3 py-2 text-slate-800 font-bold outline-none">
                <!-- JSで自動生成 -->
              </select>
            </div>
            <div>
              <label class="block text-[10px] text-amber-700 font-bold mb-1">秒 (0〜59秒)</label>
              <select id="select-delay-sec" class="w-full bg-white border border-amber-300 rounded-xl px-3 py-2 text-slate-800 font-bold outline-none">
                <!-- JSで自動生成 -->
              </select>
            </div>
          </div>
        </div>

        <!-- ボタン -->
        <div class="flex gap-2 pt-2">
          <button type="button" id="btn-clear-record" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs transition">
            未記録に戻す
          </button>
          <button type="submit" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs transition shadow-md shadow-indigo-200">
            保存する
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 1-B. 1月20日 振替可能日専用・科目割り当てモーダル -->
  <div id="modal-special-swap" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 shadow-xl transition-all">
      <div class="flex justify-between items-start mb-3">
        <div>
          <div class="text-xs font-bold text-amber-600"><i class="fa-solid fa-shuffle mr-1"></i> 1月20日(水) 振替可能日設定</div>
          <h3 id="swap-modal-period-title" class="text-base font-bold text-slate-800">第1限に開講する科目を選択</h3>
        </div>
        <button class="btn-close-modal text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">実施する科目を選択</label>
          <select id="select-swap-course" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl outline-none bg-white text-sm font-bold text-slate-800">
            <!-- JSで登録済み科目を挿入 -->
          </select>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" id="btn-clear-swap" class="flex-1 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl font-bold text-xs transition">
            授業なし (空きコマ) にする
          </button>
          <button type="button" id="btn-save-swap" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs transition shadow-md">
            この科目を割り当てる
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 科目作成・編集モーダル -->
  <div id="modal-course-edit" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 shadow-xl transition-all">
      <div
